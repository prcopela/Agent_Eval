[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgov"
version = "0.1.0"
description = "A generalized governance / control layer and evaluation harness for AI agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.70"]
dev = ["pytest>=8"]

[project.scripts]
agentgov = "agentgov.__main__:main"

[tool.setuptools.packages.find]
include = ["agentgov*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
